plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = maven_group
base.archivesName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.output.resourcesDir = sourceSets.main.output.classesDirs.singleFile

sourceSets {
    common {
        java.srcDirs = [file("../common/src/main/java")]
        resources.srcDirs = [file("../common/src/main/resources")]
    }
    main {
        compileClasspath += common.output
        runtimeClasspath += common.output
    }
}

repositories {
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            mods { gouge { source sourceSets.main; source sourceSets.common } }
        }
        server {
            workingDirectory project.file('run')
            mods { gouge { source sourceSets.main; source sourceSets.common } }
        }
    }
}

mixin {
    add sourceSets.main, 'gouge.refmap.json'
    config 'gouge.mixins.json'
}

reobf {
    jar {}
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly "maven.modrinth:parcool:H0pXfFO6"
    compileOnly "com.electronwill.night-config:toml:3.6.4"
    compileOnly "com.electronwill.night-config:core:3.6.4"
    commonCompileOnly "com.electronwill.night-config:toml:3.6.4"
    commonCompileOnly "com.electronwill.night-config:core:3.6.4"
}

configurations.commonCompileOnly.extendsFrom(configurations.minecraft)

jar {
    from sourceSets.common.output
    manifest {
        attributes([
            'MixinConfigs': 'gouge.mixins.json',
            'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'
}
