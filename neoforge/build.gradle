plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = maven_group
base.archivesName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDir file("../common/src/main/java")
sourceSets.main.resources.srcDir file("../common/src/main/resources")

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

runs {
    configureEach {
        modSource sourceSets.main
    }
    client {
        programArguments '--username', 'Dev'
    }
    server {}
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "maven.modrinth:parcool:wwqfMVm1"
    compileOnly "com.electronwill.night-config:toml:3.8.1"
    compileOnly "com.electronwill.night-config:core:3.8.1"
}

jar {
    manifest {
        attributes([
            'Implementation-Version': project.version
        ])
    }
}
