plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = maven_group
base.archivesName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.java.srcDir file("../common/src/main/java")
sourceSets.main.resources.srcDir file("../common/src/main/resources")

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

neoForge {
    version = neo_version
    runs {
        client {
            client()
            programArgument '--username'
            programArgument 'Dev'
        }
        server {
            server()
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gouge'
        }
    }
    mods {
        gouge {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "maven.modrinth:parcool:9sTw2Dnd"
    compileOnly "com.electronwill.night-config:toml:3.8.1"
    compileOnly "com.electronwill.night-config:core:3.8.1"
}

jar {
    manifest {
        attributes([
            'Implementation-Version': project.version
        ])
    }
}
