plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "com.electronwill.night-config:toml:3.8.1"
    include "com.electronwill.night-config:toml:3.8.1"
    include "com.electronwill.night-config:core:3.8.1"

    modCompileOnly "maven.modrinth:cloth-config:13.0.138+fabric"
    modCompileOnly "maven.modrinth:modmenu:9.2.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

sourceSets.main.java.srcDir file("../common/src/main/java")
sourceSets.main.java.srcDir file("../cloth/src/main/java")
sourceSets.main.resources.srcDir file("../common/src/main/resources")

loom {
    mixin {
        defaultRefmapName = "gouge.refmap.json"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
