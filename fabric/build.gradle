plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "com.electronwill.night-config:toml:3.8.1"
    include "com.electronwill.night-config:toml:3.8.1"
    include "com.electronwill.night-config:core:3.8.1"
}

sourceSets.main.java.srcDir file("../common/src/main/java")
sourceSets.main.resources.srcDir file("../common/src/main/resources")

loom {
    runs {
        client {
            client()
            configName = "Host"
            runDir = "run"
            programArgs "--username", "Host"
        }
        client2 {
            client()
            configName = "Guest"
            runDir = "run2"
            programArgs "--username", "Guest"
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
